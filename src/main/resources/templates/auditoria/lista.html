<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-clipboard-data me-2 text-primary"></i>Auditoria
        </h2>
        <span class="badge bg-secondary fs-6">
            <span th:text="${totalElementos}">0</span> registro(s)
        </span>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-sm align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">Data/Hora</th>
                            <th>Usuário</th>
                            <th>Tipo</th>
                            <th>Ação</th>
                            <th>Entidade</th>
                            <th>Método</th>
                            <th>Status</th>
                            <th class="text-end">Duração</th>
                            <th>Origem</th>
                            <th class="pe-3">Detalhes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(auditorias)}">
                            <td colspan="10" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                Nenhum registro de auditoria encontrado.
                            </td>
                        </tr>
                        <tr th:each="registro : ${auditorias}">
                            <td class="ps-3 text-nowrap"
                                th:text="${registro.dataHora != null
                                          ? #temporals.format(registro.dataHora, 'dd/MM/yyyy HH:mm:ss')
                                          : '—'}">01/01/2026 00:00:00</td>
                            <td>
                                <div class="fw-medium" th:text="${registro.usuario != null ? registro.usuario : '—'}">—</div>
                                <small class="text-muted" th:text="${registro.perfil != null ? registro.perfil : ''}"></small>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${registro.tipo.name() == 'CRIACAO' ? 'bg-success'
                                          : (registro.tipo.name() == 'ATUALIZACAO' ? 'bg-primary'
                                          : (registro.tipo.name() == 'EXCLUSAO' ? 'bg-danger'
                                          : (registro.tipo.name() == 'CONSULTA' ? 'bg-info text-dark' : 'bg-secondary')))}"
                                      th:text="${registro.tipo}">OUTRO</span>
                            </td>
                            <td>
                                <div th:text="${registro.acao}">AÇÃO</div>
                                <small class="text-muted" th:text="${registro.descricao != null ? registro.descricao : ''}"></small>
                            </td>
                            <td th:text="${registro.entidade != null ? registro.entidade : '—'}">—</td>
                            <td><small class="text-muted" th:text="${registro.metodo}"></small></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${registro.sucesso ? 'bg-success' : 'bg-danger'}"
                                      th:text="${registro.sucesso ? 'Sucesso' : 'Falha'}">Sucesso</span>
                            </td>
                            <td class="text-end text-nowrap" th:text="${registro.duracaoMs + ' ms'}">0 ms</td>
                            <td><small class="text-muted" th:text="${registro.ip != null ? registro.ip : '—'}">—</small></td>
                            <td class="pe-3">
                                <div th:if="${!#strings.isEmpty(registro.argumentos)}" class="small">
                                    <code th:text="${registro.argumentos}"></code>
                                </div>
                                <div th:if="${!#strings.isEmpty(registro.dadosAnteriores)}" class="small text-muted">
                                    <span class="fw-medium">Antes:</span>
                                    <code th:text="${registro.dadosAnteriores}"></code>
                                </div>
                                <div th:if="${!#strings.isEmpty(registro.dadosPosteriores)}" class="small text-muted">
                                    <span class="fw-medium">Depois:</span>
                                    <code th:text="${registro.dadosPosteriores}"></code>
                                </div>
                                <div th:if="${!#strings.isEmpty(registro.mensagem)}"
                                     class="small text-danger" th:text="${registro.mensagem}"></div>
                                <span th:if="${#strings.isEmpty(registro.argumentos)
                                              and #strings.isEmpty(registro.dadosAnteriores)
                                              and #strings.isEmpty(registro.dadosPosteriores)
                                              and #strings.isEmpty(registro.mensagem)}"
                                      class="text-muted">—</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
             th:if="${totalPaginas > 1}">
            <small class="text-muted">
                Mostrando
                <strong th:text="${registroInicial}">0</strong>–<strong th:text="${registroFinal}">0</strong>
                de <strong th:text="${totalElementos}">0</strong>
            </small>

            <nav aria-label="Paginação da auditoria">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${paginaAtual == 0 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/auditoria(pagina=${paginaAtual - 1}, tamanho=${tamanho})}"
                           aria-label="Anterior">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="p : ${#numbers.sequence(paginaInicial, paginaFinal)}"
                        th:classappend="${p == paginaAtual ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/auditoria(pagina=${p}, tamanho=${tamanho})}"
                           th:text="${p + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${paginaAtual >= totalPaginas - 1 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/auditoria(pagina=${paginaAtual + 1}, tamanho=${tamanho})}"
                           aria-label="Próxima">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

</body>
</html>
