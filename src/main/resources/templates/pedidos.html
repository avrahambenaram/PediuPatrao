<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Tipo de Pizza</th>
                        <th>Sabor</th>
                        <th>Quantidade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td th:text="${pedido.tipoPizza}"></td>
                        <td th:text="${pedido.sabor}"></td>
                        <td th:text="${pedido.quantidade}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
             th:if="${totalElementos > 0}">
            <small class="text-muted">
                Mostrando
                <strong th:text="${registroInicial}">0</strong>–<strong th:text="${registroFinal}">0</strong>
                de <strong th:text="${totalElementos}">0</strong>
            </small>
            <nav aria-label="Paginação de pedidos" th:if="${totalPaginas > 1}">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${paginaAtual == 0 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/pedidos(pagina=${paginaAtual - 1}, tamanho=${tamanho})}"
                           aria-label="Anterior">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="p : ${#numbers.sequence(paginaInicial, paginaFinal)}"
                        th:classappend="${p == paginaAtual ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/pedidos(pagina=${p}, tamanho=${tamanho})}"
                           th:text="${p + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${paginaAtual >= totalPaginas - 1 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/pedidos(pagina=${paginaAtual + 1}, tamanho=${tamanho})}"
                           aria-label="Próxima">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

</body>
</html>
