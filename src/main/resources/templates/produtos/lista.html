<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gerenciar Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <a href="/produtos/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Listagem de Produtos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Preço</th>
                            <th>Ativo</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lista vazia -->
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                        <!-- Linhas -->
                        <tr th:each="produto : ${produtos}">
                            <td class="ps-4 text-muted" th:text="${produto.id}"></td>
                            <td th:text="${produto.nome}"></td>
                            <td th:text="${produto.tipo}"></td>
                            <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td th:text="${produto.ativo ? 'Sim' : 'Não'}">Sim</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil-fill"></i> Editar
                                </a>
                                <form th:action="@{/produtos/excluir/{id}(id=${produto.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Tem certeza que deseja excluir este produto?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash-fill"></i> Excluir
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
             th:if="${totalElementos > 0}">
            <small class="text-muted">
                Mostrando
                <strong th:text="${registroInicial}">0</strong>–<strong th:text="${registroFinal}">0</strong>
                de <strong th:text="${totalElementos}">0</strong>
            </small>
            <nav aria-label="Paginação de produtos" th:if="${totalPaginas > 1}">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${paginaAtual == 0 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/produtos(pagina=${paginaAtual - 1}, tamanho=${tamanho})}"
                           aria-label="Anterior">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="p : ${#numbers.sequence(paginaInicial, paginaFinal)}"
                        th:classappend="${p == paginaAtual ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/produtos(pagina=${p}, tamanho=${tamanho})}"
                           th:text="${p + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${paginaAtual >= totalPaginas - 1 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/produtos(pagina=${paginaAtual + 1}, tamanho=${tamanho})}"
                           aria-label="Próxima">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

</body>
</html>
