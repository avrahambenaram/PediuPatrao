<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gerenciar Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="collapse mb-4" id="formularioProduto">
        <div class="card card-body">
            <form th:action="@{/api/produtos}" method="post" id="produtoForm">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Produto</label>
                    <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome do Produto" required>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo do Produto</label>
                    <select id="tipo" name="tipo" class="form-select" required>
                        <option value="" disabled selected>Selecione o Tipo</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">Preço</label>
                    <input type="number" id="preco" name="preco" class="form-control" placeholder="Preço (R$)" step="0.01" required>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" id="ativo" name="ativo" class="form-check-input">
                    <label for="ativo" class="form-check-label">Produto Ativo</label>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Listagem de Produtos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Preço</th>
                            <th>Ativo</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lista vazia -->
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                Nenhum produto cadastrado.
                            </td>
                        </tr>
                        <!-- Linhas -->
                        <tr th:each="produto : ${produtos}">
                            <td class="ps-4 text-muted" th:text="${produto.id}"></td>
                            <td th:text="${produto.nome}"></td>
                            <td th:text="${produto.tipo}"></td>
                            <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:text="${produto.ativo ? 'Sim' : 'Não'}">Sim</td>
                            <td class="text-end pe-4">
                                <a th:href="@{/api/produtos/{id}(id=${produto.id})}"
                                   class="btn btn-sm btn-outline-primary me-1">Editar</a>
                                <a th:href="@{/api/produtos/{id}(id=${produto.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   onclick="return confirm('Tem certeza que deseja excluir este produto?');">
                                    Excluir
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
             th:if="${totalElementos > 0}">
            <small class="text-muted">
                Mostrando
                <strong th:text="${registroInicial}">0</strong>–<strong th:text="${registroFinal}">0</strong>
                de <strong th:text="${totalElementos}">0</strong>
            </small>
            <nav aria-label="Paginação de produtos" th:if="${totalPaginas > 1}">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${paginaAtual == 0 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/produtos(pagina=${paginaAtual - 1}, tamanho=${tamanho})}"
                           aria-label="Anterior">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="p : ${#numbers.sequence(paginaInicial, paginaFinal)}"
                        th:classappend="${p == paginaAtual ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/produtos(pagina=${p}, tamanho=${tamanho})}"
                           th:text="${p + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${paginaAtual >= totalPaginas - 1 ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/produtos(pagina=${paginaAtual + 1}, tamanho=${tamanho})}"
                           aria-label="Próxima">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

</body>
</html>
