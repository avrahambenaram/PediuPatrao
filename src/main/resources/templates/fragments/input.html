<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
  <label
    th:fragment="input(type, name, placeholder, label)"
    class="w-100 d-flex flex-column gap-2"
  >
    <span th:text="${label}">Label</span>

    <input
      class="form-control"
      th:type="${type}"
      th:name="${name}"
      th:placeholder="${placeholder}"
    >
  </label>
</body>
</html>
