<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pedidos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag-plus me-2 text-primary"></i>Novo Pedido
        </h2>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm" style="max-width: 860px;">
        <div class="card-body p-4">

            <form th:action="@{/pedidos/salvar}" method="post">

                <!-- Cliente -->
                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-medium">
                        <i class="bi bi-person me-1"></i>Cliente
                    </label>
                    <select id="clienteId" name="clienteId" class="form-select" required>
                        <option value="" disabled selected>Selecione o cliente</option>
                        <option th:each="cliente : ${clientes}"
                                th:value="${cliente.id}"
                                th:text="${cliente.nome + (cliente.telefone != null ? ' — ' + cliente.telefone : '')}">
                        </option>
                    </select>
                </div>

                <hr class="my-4"/>

                <!-- Itens -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-medium">
                        <i class="bi bi-list-ul me-1"></i>Itens do pedido
                    </span>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="addItem">
                        <i class="bi bi-plus-lg me-1"></i>Adicionar item
                    </button>
                </div>

                <div id="itens"></div>

                <!-- Desconto (somente gerente) -->
                <th:block th:if="${podeGerenciar}">
                    <hr class="my-4"/>
                    <div style="max-width: 260px;">
                        <label for="descontoPercentual" class="form-label fw-medium">
                            <i class="bi bi-percent me-1"></i>Desconto (%)
                        </label>
                        <input type="number"
                               id="descontoPercentual"
                               name="descontoPercentual"
                               class="form-control"
                               min="0" max="20" step="0.01" value="0"/>
                    </div>
                </th:block>

                <!-- Botões -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Registrar Pedido
                    </button>
                    <a href="/pedidos" class="btn btn-outline-secondary">Cancelar</a>
                </div>

            </form>
        </div>
    </div>

    <!-- Modelo de linha de item (clonado via JS) -->
    <template id="itemTemplate">
        <div class="row g-2 align-items-end mb-2 item-row">
            <div class="col-8">
                <label class="form-label small mb-1">Produto</label>
                <select name="produtoId" class="form-select" required>
                    <option value="" disabled selected>Selecione o produto</option>
                    <option th:each="produto : ${produtos}"
                            th:value="${produto.id}"
                            th:text="${produto.nome + ' — R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">
                    </option>
                </select>
            </div>
            <div class="col-3">
                <label class="form-label small mb-1">Quantidade</label>
                <input type="number" name="quantidade" class="form-control" min="1" step="1" value="1" required/>
            </div>
            <div class="col-1 text-end">
                <button type="button" class="btn btn-outline-danger btn-remove" title="Remover item">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>
    </template>

    <script>
        (function () {
            const container = document.getElementById('itens');
            const template = document.getElementById('itemTemplate');

            function adicionarItem() {
                container.appendChild(template.content.cloneNode(true));
            }

            container.addEventListener('click', function (evento) {
                const botao = evento.target.closest('.btn-remove');
                if (!botao) {
                    return;
                }
                const linhas = container.querySelectorAll('.item-row');
                if (linhas.length > 1) {
                    botao.closest('.item-row').remove();
                } else {
                    alert('O pedido deve ter ao menos um item.');
                }
            });

            document.getElementById('addItem').addEventListener('click', adicionarItem);
            adicionarItem();
        })();
    </script>

</div>

</body>
</html>
