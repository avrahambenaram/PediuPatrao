<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" th:if="${podeGerenciar}">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela" th:attr="data-pode-gerenciar=${podeGerenciar}">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2 d-none"
             id="clientes-paginacao"></div>
    </div>

    <script>
        const API_URL = '/api/clientes';
        const TAMANHO = 20;
        const tabelaClientes = document.getElementById('clientes-tabela');
        const paginacaoClientes = document.getElementById('clientes-paginacao');
        const PODE_GERENCIAR = tabelaClientes.dataset.podeGerenciar === 'true';
        let paginaAtual = 0;

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function carregarClientes(pagina = 0) {
            const response = await fetch(`${API_URL}?pagina=${pagina}&tamanho=${TAMANHO}`);
            const data = await response.json();

            if (data.conteudo.length === 0 && data.pagina > 0) {
                carregarClientes(data.pagina - 1);
                return;
            }

            paginaAtual = data.pagina;
            tabelaClientes.innerHTML = '';

            if (data.conteudo.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                paginacaoClientes.innerHTML = '';
                paginacaoClientes.classList.add('d-none');
                return;
            }

            data.conteudo.forEach(cliente => {
                const row = document.createElement('tr');
                const acoes = PODE_GERENCIAR
                    ? `<a href="/clientes/editar/${cliente.id}" class="btn btn-sm btn-outline-primary me-1">
                           <i class="bi bi-pencil-fill"></i> Editar
                       </a>
                       <button class="btn btn-sm btn-outline-danger" onclick="excluirCliente('${cliente.id}')">
                           <i class="bi bi-trash-fill"></i> Excluir
                       </button>`
                    : '<span class="text-muted">—</span>';
                row.innerHTML = `
                    <td>${cliente.nome || '—'}</td>
                    <td>${cliente.telefone || '—'}</td>
                    <td>${formatarEndereco(cliente)}</td>
                    <td class="text-end pe-4">${acoes}</td>
                `;
                tabelaClientes.appendChild(row);
            });

            renderizarPaginacao(data);
        }

        function renderizarPaginacao(data) {
            paginacaoClientes.classList.remove('d-none');

            const primeiro = data.pagina * data.tamanho + 1;
            const ultimo = Math.min((data.pagina + 1) * data.tamanho, data.totalElementos);

            let itens = '';
            if (data.totalPaginas > 1) {
                const janela = 5;
                let inicio = Math.max(0, paginaAtual - Math.floor(janela / 2));
                let fim = Math.min(data.totalPaginas - 1, inicio + janela - 1);
                inicio = Math.max(0, fim - janela + 1);

                itens += `
                    <li class="page-item ${paginaAtual === 0 ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-pagina="${paginaAtual - 1}" aria-label="Anterior">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>`;

                for (let p = inicio; p <= fim; p++) {
                    itens += `
                        <li class="page-item ${p === paginaAtual ? 'active' : ''}">
                            <a class="page-link" href="#" data-pagina="${p}">${p + 1}</a>
                        </li>`;
                }

                itens += `
                    <li class="page-item ${paginaAtual >= data.totalPaginas - 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-pagina="${paginaAtual + 1}" aria-label="Próxima">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>`;
            }

            paginacaoClientes.innerHTML = `
                <small class="text-muted">
                    Mostrando <strong>${primeiro}</strong>–<strong>${ultimo}</strong>
                    de <strong>${data.totalElementos}</strong>
                </small>
                <nav aria-label="Paginação de clientes">
                    <ul class="pagination pagination-sm mb-0">${itens}</ul>
                </nav>`;

            paginacaoClientes.querySelectorAll('a[data-pagina]').forEach(link => {
                link.addEventListener('click', evento => {
                    evento.preventDefault();
                    const destino = parseInt(link.dataset.pagina, 10);
                    if (destino < 0 || destino > data.totalPaginas - 1) {
                        return;
                    }
                    carregarClientes(destino);
                });
            });
        }

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    alert('Cliente excluído com sucesso!');
                    carregarClientes(paginaAtual);
                } else {
                    alert('Erro ao excluir o cliente.');
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
